name: Refresh current.json

# TRMNL skips re-rendering when a polled response is unchanged, so the plugin
# would freeze on whichever day it last rendered. Regenerating this small file
# every 15 minutes keeps the payload changing, so a device polling on its own
# schedule re-renders promptly after the viewer's local midnight.
#
# Why 15 and not 60: local midnight lands on a half-hour UTC boundary in some
# timezones (India, parts of Australia), so an hourly job could leave those
# users on yesterday's fact until ~00:50 local. GitHub also delays scheduled
# runs under load, which eats any thinner margin.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:       # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-current
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate current.json
        run: python3 scripts/make_current.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/current.json)" ]]; then
            git add data/current.json
            git commit -m "Refresh current.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "no change"
          fi
