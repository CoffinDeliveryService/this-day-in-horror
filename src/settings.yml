# TRMNL private plugin settings (trmnlp format)
#
# Static strategy: the dataset lives in the plugin, not on a polling URL.
# TRMNL skips re-rendering when polled data is unchanged, but Static data is
# exempt — so every device refresh regenerates the screen and the template
# re-evaluates the viewer's local date. See README.
---
name: This Day in Horror
refresh_interval: 15
strategy: static
dark_mode: "no"
# static_data: contents of data/static_data.json (86 KB, 366 days)
